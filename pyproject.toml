[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-ai"
version = "0.1.0"
description = "Aegis AI — Private Personal AI Operator with Persistent Memory, Safe Workspace, and Approvals"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Aegis AI Team" }
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "python-dotenv>=1.0.0",
    "openai>=1.20.0",
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0.0"
]

[project.scripts]
aegis-ai = "main:start"
aegis = "main:start"

[tool.setuptools]
packages = ["app", "app.api", "app.security", "app.services"]
py-modules = ["main"]

[tool.setuptools.package-data]
"*" = ["frontend/*", "skills/*"]

